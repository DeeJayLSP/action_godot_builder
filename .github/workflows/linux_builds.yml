name: 🐧 Linux Builds
on:
  workflow_call:
    inputs:
      base-branch:
        description: 'Base branch to use for the builds'
        type: string
      lto:
        description: 'LTO mode. Options: "none", "thin", "full"'
        type: string
      repo:
        description: 'Repository to use for the build'
        type: string
      tag:
        description: 'Tag to use for the build'
        type: string
      module_flags:
        description: 'Extra module flags, e.g. module_webm_enabled=no'
        type: string
      template_module_flags:
        description: 'Extra module flags for template build, e.g. module_webm_enabled=no'
        type: string
      use_encryption_key:
        description: 'Whether to use the encryption key for the build (if available)'
        type: string

# Global Settings
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ inputs.base-branch }}
  SCONSFLAGS: verbose=yes warnings=extra werror=yes strict_checks=yes linker=lld
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TSAN_OPTIONS: suppressions=misc/error_suppressions/tsan.txt
  UBSAN_OPTIONS: suppressions=misc/error_suppressions/ubsan.txt

jobs:
  build-linux:
    # Use AlmaLinux 8 to increase portability of Linux artifacts.
    runs-on: ubuntu-latest
    container: almalinux:8
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor arch=x86_64)
            target: editor
            scons-flags: arch=x86_64
            scons-mono-flags: ''
            build-mono: false

          # TODO re-enable these
          #- name: Editor (target=editor arch=x86_32)
          #  target: editor
          #  scons-flags: arch=x86_32

          - name: Template (target=template_release, arch=x86_64)
            target: template_release
            scons-flags: arch=x86_64
            scons-mono-flags: ''
            build-mono: false

          - name: Template (target=template_debug, arch=x86_64)
            target: template_debug
            scons-flags: arch=x86_64
            scons-mono-flags: ''
            build-mono: false

          - name: Editor Mono (target=editor arch=x86_64)
            target: editor
            scons-flags: arch=x86_64 module_mono_enabled=yes
            build-mono: true
            scons-mono-flags: mono_glue=yes

          - name: Template Mono (target=template_release arch=x86_64)
            target: template_release
            scons-flags: arch=x86_64 module_mono_enabled=yes mono_static=yes
            build-mono: true
            scons-mono-flags: mono_glue=yes

          - name: Template Mono (target=template_debug arch=x86_64)
            target: template_debug
            scons-flags: arch=x86_64 module_mono_enabled=yes mono_static=yes
            build-mono: true
            scons-mono-flags: mono_glue=yes

    steps:
      - name: Setup Linux environment
        run: |
          rpm --import https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf update -y

      - name: Install required packages
        run: |
          dnf install -y gcc-c++ git pkgconfig tar bzip2 wget file

      - name: Export Encryption Key
        if: ${{ inputs.use_encryption_key == 'true' }}
        run: echo "SCRIPT_AES256_ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" >> $GITHUB_ENV

      - name: Install .NET SDK
        if: matrix.build-mono
        run: |
          dnf install -y dotnet-sdk-8.0

      # Comes last as this modifies PATH
      - name: Install 64-bit dependencies
        if: matrix.scons-flags == 'arch=x86_64'
        run: |
          dnf install -y libatomic libatomic-static libstdc++-static wayland-devel
          ln -s /usr/lib/gcc/$x86_64-redhat-linux/8/libatomic.a /usr/lib/libatomic.a
          wget https://github.com/godotengine/buildroot/releases/download/godot-2023.08.x-4/x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2
          tar -xjf x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2 -C /opt
          /opt/x86_64-godot-linux-gnu_sdk-buildroot/relocate-sdk.sh
          export PATH=/opt/x86_64-godot-linux-gnu_sdk-buildroot/bin:$PATH
          echo "PATH=/opt/x86_64-godot-linux-gnu_sdk-buildroot/bin:$PATH" >> $GITHUB_PATH
          x86_64-godot-linux-gnu-gcc --version

      - name: Install 32-bit dependencies
        if: matrix.scons-flags == 'arch=x86_32'
        run: |
          dnf install -y libatomic.i686 libatomic-static.i686 libstdc++-static.i686 wayland-devel.i686
          ln -s /usr/lib/gcc/$i686-redhat-linux/8/libatomic.a /usr/lib/libatomic.a
          wget https://github.com/godotengine/buildroot/releases/download/godot-2023.08.x-4/i686-godot-linux-gnu_sdk-buildroot.tar.bz2
          tar -xjf i686-godot-linux-gnu_sdk-buildroot.tar.bz2 -C /opt
          /opt/i686-godot-linux-gnu_sdk-buildroot/relocate-sdk.sh
          export PATH=/opt/i686-godot-linux-gnu_sdk-buildroot/bin:$PATH
          echo "PATH=/opt/i686-godot-linux-gnu_sdk-buildroot/bin:$PATH" >> $GITHUB_PATH
          i686-godot-linux-gnu-gcc --version

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Setup SCons cache
        run: |
          echo ::add-matcher::misc/utility/problem-matchers.json
          mkdir -p /home/runner/work/action_godot_builder/action_godot_builder/.scons_cache
          chmod -R u+rw /home/runner/work/action_godot_builder/action_godot_builder/.scons_cache || true

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-${{ matrix.target }}-${{ matrix.scons-flags }}-${{ inputs.lto }}
        continue-on-error: true

      - name: Mono compilation (pre-glue)
        if: matrix.build-mono
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONSFLAGS }} ${{ matrix.scons-flags }} ${{ inputs.lto }} ${{ inputs.module_flags }} mono_glue=no
          platform: linuxbsd
          target: editor

      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue ./modules/mono/glue

      - name: Compilation (Editor)
        if: matrix.target == 'editor'
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONSFLAGS }} ${{ matrix.scons-flags }} ${{ matrix.scons-mono-flags }} ${{ inputs.lto }} ${{ inputs.module_flags }}
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Compilation (Template)
        if: matrix.target != 'editor'
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONSFLAGS }} ${{ matrix.scons-flags }} ${{ matrix.scons-mono-flags }} ${{ inputs.lto }} ${{ inputs.template_module_flags }}
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-${{ matrix.target }}-${{ matrix.scons-flags }}-${{ inputs.lto }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Build .NET solutions
        if: matrix.build-mono
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --werror

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}-${{ matrix.scons-flags }}-${{ inputs.lto }}
          path: bin
